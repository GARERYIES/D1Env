[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "d1env"
version = "0.3.0"
description = "D1Env: local Chinese wizard with scoped Docker/ROS software deployment"
requires-python = ">=3.10"
dependencies = ["fastapi", "pydantic>=2,<3", "PyYAML", "typer", "uvicorn"]

[project.scripts]
d1env = "d1env.cli:app"

[dependency-groups]
dev = ["pytest", "httpx", "httpx2", "ruff", "mypy", "types-PyYAML", "jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["src/d1env"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "d1env/_assets/profiles"
"frontend/dist" = "d1env/_assets/frontend/dist"
"docs/research/UPSTREAM_LOCK.json" = "d1env/_assets/docs/research/UPSTREAM_LOCK.json"
"docs/build" = "d1env/_assets/docs/build"
"THIRD_PARTY_NOTICES.md" = "d1env/_assets/THIRD_PARTY_NOTICES.md"
"licenses" = "d1env/_assets/licenses"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["d1env"]
mypy_path = "src"
